<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calc & Play</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e12;
    --surface: #18181f;
    --surface2: #222230;
    --surface3: #2c2c3e;
    --accent: #c8f060;
    --accent2: #7c6fff;
    --text: #f0eefc;
    --text-muted: #7a7a9a;
    --border: rgba(255,255,255,0.07);
    --radius: 20px;
    --radius-sm: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(124,111,255,0.08) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(200,240,96,0.06) 0%, transparent 60%);
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeDown 0.5s ease;
  }

  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(1.4rem, 4vw, 2rem);
    letter-spacing: -0.02em;
    color: var(--text);
  }

  header h1 span { color: var(--accent); }
  header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

  .layout {
    display: flex;
    gap: 2rem;
    width: 100%;
    max-width: 820px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ── CALCULATOR ── */
  .calculator {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1.5rem;
    width: 320px;
    flex-shrink: 0;
    animation: fadeUp 0.5s ease 0.1s both;
  }

  .calc-display {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 1.2rem 1.4rem;
    margin-bottom: 1.2rem;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    border: 1px solid var(--border);
  }

  .calc-expression {
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    min-height: 18px;
    word-break: break-all;
  }

  .calc-value {
    font-family: 'Space Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
    word-break: break-all;
    transition: color 0.15s;
  }

  .calc-value.updated { color: var(--accent); }

  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .btn {
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    height: 58px;
    transition: transform 0.08s, background 0.1s, box-shadow 0.1s;
    position: relative;
    overflow: hidden;
  }

  .btn:active { transform: scale(0.93); }

  .btn-num {
    background: var(--surface2);
    color: var(--text);
  }
  .btn-num:hover { background: var(--surface3); }

  .btn-op {
    background: var(--surface3);
    color: var(--accent2);
  }
  .btn-op:hover { background: #35354a; }

  .btn-special {
    background: var(--surface3);
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .btn-special:hover { background: #35354a; }

  .btn-equals {
    background: var(--accent);
    color: #0e0e12;
  }
  .btn-equals:hover { background: #d6f470; box-shadow: 0 0 20px rgba(200,240,96,0.3); }

  .btn-clear {
    background: rgba(255,80,80,0.15);
    color: #ff6b6b;
  }
  .btn-clear:hover { background: rgba(255,80,80,0.25); }

  .btn-zero { grid-column: span 2; }

  /* ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    width: 60px; height: 60px;
    background: rgba(255,255,255,0.15);
    transform: scale(0);
    animation: ripple 0.4s ease-out;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  /* ── TIC TAC TOE ── */
  .tictactoe {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1.5rem;
    width: 320px;
    flex-shrink: 0;
    animation: fadeUp 0.5s ease 0.2s both;
  }

  .ttt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
  }

  .ttt-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .ttt-scores {
    display: flex;
    gap: 8px;
  }

  .score-pill {
    background: var(--surface2);
    border-radius: 8px;
    padding: 4px 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .score-pill .player-label { color: var(--text-muted); }
  .score-pill .player-x { color: var(--accent2); }
  .score-pill .player-o { color: var(--accent); }
  .score-pill .score-val { color: var(--text); font-weight: 700; }

  .ttt-status {
    text-align: center;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    color: var(--text-muted);
    min-height: 24px;
    font-weight: 500;
  }

  .ttt-status .highlight-x { color: var(--accent2); font-weight: 700; }
  .ttt-status .highlight-o { color: var(--accent); font-weight: 700; }
  .ttt-status .highlight-win { color: var(--accent); font-family: 'Space Mono', monospace; }

  .ttt-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1rem;
  }

  .ttt-cell {
    aspect-ratio: 1;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 1.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.1s, transform 0.08s, border-color 0.2s;
    position: relative;
    overflow: hidden;
  }

  .ttt-cell:hover:not(.taken) { background: var(--surface3); transform: scale(1.03); }
  .ttt-cell.taken { cursor: default; }
  .ttt-cell.x-cell { color: var(--accent2); border-color: rgba(124,111,255,0.3); }
  .ttt-cell.o-cell { color: var(--accent); border-color: rgba(200,240,96,0.3); }
  .ttt-cell.win-cell { background: var(--surface3); animation: winPulse 0.5s ease; }
  .ttt-cell.x-cell.win-cell { border-color: var(--accent2); background: rgba(124,111,255,0.15); }
  .ttt-cell.o-cell.win-cell { border-color: var(--accent); background: rgba(200,240,96,0.1); }

  @keyframes winPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .ttt-cell .mark {
    display: inline-block;
    animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .ttt-footer {
    display: flex;
    gap: 8px;
  }

  .ttt-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.1s;
  }

  .ttt-btn-reset {
    background: var(--surface2);
    color: var(--text-muted);
  }
  .ttt-btn-reset:hover { background: var(--surface3); color: var(--text); }

  .ttt-btn-new {
    background: rgba(124,111,255,0.2);
    color: var(--accent2);
  }
  .ttt-btn-new:hover { background: rgba(124,111,255,0.3); }

  /* mode toggle */
  .mode-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 1rem;
    background: var(--surface2);
    border-radius: 10px;
    padding: 4px;
  }

  .mode-btn {
    flex: 1;
    padding: 6px;
    border: none;
    border-radius: 7px;
    font-size: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--text-muted);
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: var(--surface3);
    color: var(--text);
  }

  /* animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 680px) {
    .layout { gap: 1.2rem; }
    .calculator, .tictactoe { width: min(320px, 100%); }
  }
</style>
</head>
<body>

<header>
  <h1>Calc<span>&</span>Play</h1>
  <p>Calculator · Tic Tac Toe</p>
</header>

<div class="layout">

  <!-- CALCULATOR -->
  <div class="calculator">
    <div class="calc-display">
      <div class="calc-expression" id="expression"></div>
      <div class="calc-value" id="display">0</div>
    </div>
    <div class="calc-grid">
      <button class="btn btn-special btn-clear" onclick="calcClear()">AC</button>
      <button class="btn btn-special" onclick="calcToggleSign()">+/−</button>
      <button class="btn btn-special" onclick="calcPercent()">%</button>
      <button class="btn btn-op" onclick="calcOp('÷')">÷</button>

      <button class="btn btn-num" onclick="calcNum('7')">7</button>
      <button class="btn btn-num" onclick="calcNum('8')">8</button>
      <button class="btn btn-num" onclick="calcNum('9')">9</button>
      <button class="btn btn-op" onclick="calcOp('×')">×</button>

      <button class="btn btn-num" onclick="calcNum('4')">4</button>
      <button class="btn btn-num" onclick="calcNum('5')">5</button>
      <button class="btn btn-num" onclick="calcNum('6')">6</button>
      <button class="btn btn-op" onclick="calcOp('−')">−</button>

      <button class="btn btn-num" onclick="calcNum('1')">1</button>
      <button class="btn btn-num" onclick="calcNum('2')">2</button>
      <button class="btn btn-num" onclick="calcNum('3')">3</button>
      <button class="btn btn-op" onclick="calcOp('+')">+</button>

      <button class="btn btn-num btn-zero" onclick="calcNum('0')">0</button>
      <button class="btn btn-num" onclick="calcDot()">.</button>
      <button class="btn btn-equals" onclick="calcEquals()">=</button>
    </div>
  </div>

  <!-- TIC TAC TOE -->
  <div class="tictactoe">
    <div class="ttt-header">
      <span class="ttt-title">Tic Tac Toe</span>
      <div class="ttt-scores">
        <div class="score-pill">
          <span class="player-label player-x">X</span>
          <span class="score-val" id="scoreX">0</span>
        </div>
        <div class="score-pill">
          <span class="player-label" style="color:var(--text-muted)">D</span>
          <span class="score-val" id="scoreD">0</span>
        </div>
        <div class="score-pill">
          <span class="player-label player-o">O</span>
          <span class="score-val" id="scoreO">0</span>
        </div>
      </div>
    </div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="mode2p" onclick="setMode('2p')">2 Players</button>
      <button class="mode-btn" id="modeAI" onclick="setMode('ai')">vs AI</button>
    </div>

    <div class="ttt-status" id="tttStatus">
      <span class="highlight-x">X</span>'s turn
    </div>

    <div class="ttt-board" id="tttBoard"></div>

    <div class="ttt-footer">
      <button class="ttt-btn ttt-btn-reset" onclick="tttReset()">New Round</button>
      <button class="ttt-btn ttt-btn-new" onclick="tttNewGame()">Reset Scores</button>
    </div>
  </div>

</div>

<script>
// ── CALCULATOR ──
let calcState = { display: '0', expression: '', operand: null, operator: null, justEquals: false };

function updateDisplay(val, flash) {
  const el = document.getElementById('display');
  el.textContent = val;
  if (flash) {
    el.classList.add('updated');
    setTimeout(() => el.classList.remove('updated'), 300);
  }
  document.getElementById('expression').textContent = calcState.expression;
}

function calcNum(n) {
  if (calcState.justEquals) { calcState.display = n; calcState.justEquals = false; }
  else if (calcState.display === '0' && n !== '.') calcState.display = n;
  else if (calcState.display.length < 12) calcState.display += n;
  updateDisplay(calcState.display);
}

function calcDot() {
  if (calcState.justEquals) { calcState.display = '0.'; calcState.justEquals = false; }
  else if (!calcState.display.includes('.')) calcState.display += '.';
  updateDisplay(calcState.display);
}

function calcOp(op) {
  calcState.justEquals = false;
  if (calcState.operator && calcState.operand !== null) {
    const res = compute(calcState.operand, parseFloat(calcState.display), calcState.operator);
    calcState.operand = res;
    calcState.display = formatNum(res);
  } else {
    calcState.operand = parseFloat(calcState.display);
  }
  calcState.operator = op;
  calcState.expression = formatNum(calcState.operand) + ' ' + op;
  updateDisplay(calcState.display);
}

function calcEquals() {
  if (calcState.operator === null || calcState.operand === null) return;
  const b = parseFloat(calcState.display);
  calcState.expression = formatNum(calcState.operand) + ' ' + calcState.operator + ' ' + formatNum(b) + ' =';
  const res = compute(calcState.operand, b, calcState.operator);
  calcState.display = formatNum(res);
  calcState.operand = null;
  calcState.operator = null;
  calcState.justEquals = true;
  updateDisplay(calcState.display, true);
}

function compute(a, b, op) {
  if (op === '+') return a + b;
  if (op === '−') return a - b;
  if (op === '×') return a * b;
  if (op === '÷') return b === 0 ? 0 : a / b;
  return b;
}

function formatNum(n) {
  if (!isFinite(n)) return 'Error';
  const s = parseFloat(n.toPrecision(10)).toString();
  return s.length > 12 ? parseFloat(n.toFixed(6)).toString() : s;
}

function calcClear() {
  calcState = { display: '0', expression: '', operand: null, operator: null, justEquals: false };
  updateDisplay('0');
}

function calcToggleSign() {
  if (calcState.display !== '0') {
    calcState.display = calcState.display.startsWith('-')
      ? calcState.display.slice(1)
      : '-' + calcState.display;
    updateDisplay(calcState.display);
  }
}

function calcPercent() {
  calcState.display = formatNum(parseFloat(calcState.display) / 100);
  calcState.justEquals = false;
  updateDisplay(calcState.display);
}

// Ripple effect
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    const r = document.createElement('span');
    r.className = 'ripple';
    const rect = this.getBoundingClientRect();
    r.style.left = (e.clientX - rect.left - 30) + 'px';
    r.style.top = (e.clientY - rect.top - 30) + 'px';
    this.appendChild(r);
    setTimeout(() => r.remove(), 400);
  });
});

// Keyboard support
document.addEventListener('keydown', e => {
  if ('0123456789'.includes(e.key)) calcNum(e.key);
  else if (e.key === '.') calcDot();
  else if (e.key === '+') calcOp('+');
  else if (e.key === '-') calcOp('−');
  else if (e.key === '*') calcOp('×');
  else if (e.key === '/') { e.preventDefault(); calcOp('÷'); }
  else if (e.key === 'Enter' || e.key === '=') calcEquals();
  else if (e.key === 'Escape') calcClear();
  else if (e.key === 'Backspace') {
    if (calcState.display.length > 1) calcState.display = calcState.display.slice(0,-1);
    else calcState.display = '0';
    updateDisplay(calcState.display);
  }
});

// ── TIC TAC TOE ──
let board = Array(9).fill(null);
let currentPlayer = 'X';
let gameOver = false;
let scores = { X: 0, O: 0, D: 0 };
let mode = '2p'; // '2p' or 'ai'

const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function setMode(m) {
  mode = m;
  document.getElementById('mode2p').classList.toggle('active', m === '2p');
  document.getElementById('modeAI').classList.toggle('active', m === 'ai');
  tttReset();
}

function renderBoard() {
  const boardEl = document.getElementById('tttBoard');
  boardEl.innerHTML = '';
  board.forEach((cell, i) => {
    const div = document.createElement('div');
    div.className = 'ttt-cell' + (cell ? ' taken' : '') + (cell === 'X' ? ' x-cell' : cell === 'O' ? ' o-cell' : '');
    if (cell) div.innerHTML = `<span class="mark">${cell}</span>`;
    if (!cell && !gameOver) div.addEventListener('click', () => makeMove(i));
    boardEl.appendChild(div);
  });
}

function makeMove(i) {
  if (board[i] || gameOver) return;
  board[i] = currentPlayer;
  renderBoard();
  const win = checkWin();
  if (win) {
    highlightWin(win);
    scores[currentPlayer]++;
    updateScores();
    setStatus(`<span class="highlight-win">${currentPlayer} wins! 🎉</span>`);
    gameOver = true;
  } else if (board.every(c => c)) {
    setStatus('Draw!');
    scores.D++;
    updateScores();
    gameOver = true;
  } else {
    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    setStatus(`<span class="highlight-${currentPlayer.toLowerCase()}">${currentPlayer}</span>'s turn`);
    if (mode === 'ai' && currentPlayer === 'O' && !gameOver) {
      setTimeout(aiMove, 350);
    }
  }
}

function aiMove() {
  const best = minimax(board, 'O');
  if (best.index !== undefined) makeMove(best.index);
}

function minimax(b, player) {
  const avail = b.map((v,i) => v ? null : i).filter(v => v !== null);
  const win = checkWinFor(b, 'O');
  if (win) return { score: 10 };
  if (checkWinFor(b, 'X')) return { score: -10 };
  if (avail.length === 0) return { score: 0 };
  const moves = avail.map(i => {
    const nb = [...b]; nb[i] = player;
    const res = minimax(nb, player === 'O' ? 'X' : 'O');
    return { index: i, score: res.score };
  });
  return player === 'O'
    ? moves.reduce((a,b) => b.score > a.score ? b : a)
    : moves.reduce((a,b) => b.score < a.score ? b : a);
}

function checkWin() {
  return WINS.find(([a,b,c]) => board[a] && board[a] === board[b] && board[b] === board[c]) || null;
}

function checkWinFor(b, p) {
  return WINS.some(([a,x,c]) => b[a] === p && b[x] === p && b[c] === p);
}

function highlightWin(combo) {
  const cells = document.querySelectorAll('.ttt-cell');
  combo.forEach(i => cells[i].classList.add('win-cell'));
}

function setStatus(html) {
  document.getElementById('tttStatus').innerHTML = html;
}

function updateScores() {
  document.getElementById('scoreX').textContent = scores.X;
  document.getElementById('scoreO').textContent = scores.O;
  document.getElementById('scoreD').textContent = scores.D;
}

function tttReset() {
  board = Array(9).fill(null);
  currentPlayer = 'X';
  gameOver = false;
  renderBoard();
  setStatus(`<span class="highlight-x">X</span>'s turn`);
}

function tttNewGame() {
  scores = { X: 0, O: 0, D: 0 };
  updateScores();
  tttReset();
}

renderBoard();
</script>
</body>
</html>
